<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const K='lifequest_v1';
const PRE={cyber:{n:'Cyber Cyan',pri:'#22D3EE',btn:'#3B82F6',prog:'#22D3EE',bg:'#050B1A',card:'#0D1B35'},fantasy:{n:'Fantasy Purple',pri:'#7857FF',btn:'#7857FF',prog:'#4DA3FF',bg:'#0B1230',card:'#1A1F4A'},space:{n:'Space Blue',pri:'#3B82F6',btn:'#2563EB',prog:'#38BDF8',bg:'#060E24',card:'#0F1D45'},nature:{n:'Nature Green',pri:'#22C55E',btn:'#16A34A',prog:'#86EFAC',bg:'#0A1F14',card:'#12301F'},sakura:{n:'Sakura Pink',pri:'#F472B6',btn:'#EC4899',prog:'#F9A8D4',bg:'#2A1220',card:'#3B1A2E'},sunset:{n:'Sunset Orange',pri:'#FB923C',btn:'#F97316',prog:'#FDBA74',bg:'#241209',card:'#3A1F10'},mono:{n:'Minimal Monochrome',pri:'#E5E5E5',btn:'#A3A3A3',prog:'#D4D4D4',bg:'#0A0A0A',card:'#1C1C1C'}};
const DIFF={easy:{n:'ง่าย',x:10},mid:{n:'ปานกลาง',x:25},hard:{n:'ยาก',x:50}};
const CATS=['อ่านหนังสือ','สุขภาพ','การเรียนรู้','งาน','ไลฟ์สไตล์','บ้าน'];
const ICONS=['📚','🏃','💧','🧹','☕','🌅','💼','🎯','🇬🇧','🧘','🍎','🎨'];
const AVS=['🧙','🦸','🧝','🥷','🐉','🦊','🤖','👑'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DEF=()=>({name:'',avatar:'🧙',onboarded:false,exp:0,quests:[],log:{},bonus:{},ach:{},del:[],uid:null,dirty:false,fs:15,notes:[],fav:[],focus:[],use:{},theme:{preset:'cyber',mode:'dark',ov:{}},saved:[],notif:{on:true,leads:[10],end:true,sum:'18:00',quiet:{on:false,from:'22:00',to:'07:00'}},fired:{}});
let S=DEF(),R='home',D=null,cm=new Date(),selDay=null,E={};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){}
const saveLocal=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{S.dirty=true;saveLocal();queueSync()};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>key(new Date());
const pd=k=>new Date(k+'T00:00:00');
const thDate=(k,o)=>pd(k).toLocaleDateString('th-TH',o||{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const uid=()=>crypto.randomUUID();
/* ---------- colour / theme tokens ---------- */
const rgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const hex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return hex(x.map((v,i)=>v*(1-t)+y[i]*t))};
const lum=h=>{const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const ink=h=>lum(h)>.45?'#111827':'#F8FAFC';
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const okHex=v=>/^#[0-9a-fA-F]{6}$/.test(v);
function resolve(t){const p=PRE[t.preset]||PRE.fantasy,o=t.ov||{};const m=t.mode=='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t.mode,L=m=='light';
const fx=c=>L&&lum(c)>.6?mix(c,'#000000',.65):c;
const bg=o.bg||(L?mix(p.pri,'#ffffff',.93):p.bg),card=o.card||(L?'#ffffff':p.card),btn=o.btn||fx(p.btn),pri=o.pri||fx(p.pri),prog=o.prog||fx(p.prog);
const txt=o.txt||ink(bg),ctxt=o.txt||ink(card);
return{'--star':L?'#0000':'#ffffff90','--sh':L?'#0000001f':'#00000066','--pri':pri,'--btn':btn,'--prog':prog,'--bg':bg,'--card':card,'--txt':txt,'--ctxt':ctxt,'--onbtn':ink(btn),'--mut':mix(ctxt,card,.4)}}
function paint(el,t){const v=resolve(t);for(const k in v)el.style.setProperty(k,v[k])}
/* ---------- game logic ---------- */
function lvlOf(x){let l=1,need=100;while(x>=need){x-=need;l++;need=100+(l-1)*50}return{l,cur:x,need}}
const dow=k=>pd(k).getDay();
const appears=(q,d)=>!q.paused&&(q.rep=='once'?q.date==d:d>=q.start&&(q.rep=='daily'||(q.days||[]).includes(dow(d))));
const questsOn=d=>S.quests.filter(q=>appears(q,d)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const done=(q,d)=>!!(S.log[d]&&S.log[d][q.id]);
const dayCount=d=>Object.keys(S.log[d]||{}).length;
function streaks(){const ks=Object.keys(S.log).filter(k=>dayCount(k)>0).sort();const has=new Set(ks);let d=new Date();if(!has.has(key(d)))d.setDate(d.getDate()-1);let cur=0;while(has.has(key(d))){cur++;d.setDate(d.getDate()-1)}
let best=0,run=0,prev=null;ks.forEach(k=>{run=prev&&Math.round((pd(k)-pd(prev))/864e5)==1?run+1:1;best=Math.max(best,run);prev=k});return{cur,best}}
function totals(){let n=0,read=0;for(const d in S.log)for(const i in S.log[d]){n++;if(S.log[d][i].c=='อ่านหนังสือ')read+=S.log[d][i].m||0}return{n,read,bon:Object.keys(S.bonus).length,lv:lvlOf(S.exp).l,...streaks()}}
const ACH=[['first','🌟','ก้าวแรก','ทำภารกิจแรกสำเร็จ',s=>s.n>=1],['st7','🔥','ไฟลุกโชน','ทำภารกิจต่อเนื่อง 7 วัน',s=>s.best>=7],['n50','🏆','นักสู้ตัวจริง','ทำภารกิจสำเร็จ 50 ครั้ง',s=>s.n>=50],['rd','📚','หนอนหนังสือ','อ่านหนังสือครบ 10 ชั่วโมง',s=>s.read>=600],['lv5','⚔️','นักผจญภัย','ถึงเลเวล 5',s=>s.lv>=5],['all','🎯','ครบทั้งวัน','ทำภารกิจครบทั้งวัน',s=>s.bon>=1]];
function checkAch(){const t=totals();ACH.forEach(a=>{if(!S.ach[a[0]]&&a[4](t)){S.ach[a[0]]=today();setTimeout(()=>notify('🏅 ปลดล็อก Achievement',a[2]+' — '+a[3]),700)}})}
function complete(id,d){const q=S.quests.find(x=>x.id==id);if(!q||done(q,d)||d!=today())return;const L=lvlOf(S.exp).l,x=DIFF[q.diff].x;
(S.log[d]=S.log[d]||{})[id]={t:q.title,c:q.cat,x,m:q.mins||0};S.exp+=x;let m='+'+x+' EXP';

notify('✅ '+q.title,m);checkAch();save();closeModal();render();if(lvlOf(S.exp).l>L)levelUp()}

/* ---------- notifications (works while app is open) ---------- */
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tm=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const quiet=()=>{const q=S.notif.quiet;if(!q.on)return false;const n=nowM(),a=tm(q.from),b=tm(q.to);return a<=b?n>=a&&n<b:n>=a||n<b};
function toast(m){const e=document.createElement('div');e.textContent=m;$('#ts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function notify(t,b){toast(t+(b?' '+b:''));if(!S.notif.on||quiet())return;try{if('Notification' in window&&Notification.permission=='granted')new Notification(t,{body:b})}catch(e){}}
function tick(){if(!S.onboarded||!S.notif.on)return;const d=today(),n=nowM();let ch=false;
const fire=(k,t,b)=>{if(S.fired[k])return;S.fired[k]=1;ch=true;notify(t,b)};
for(const k in S.fired)if(!k.startsWith(d))delete S.fired[k];
questsOn(d).forEach(q=>{if(!q.time||done(q,d))return;const df=tm(q.time)-n;
S.notif.leads.forEach(l=>{if(df>0&&df<=l)fire(d+q.id+l,'⏰ อีก '+df+' นาที',q.title)});
if(S.notif.end&&df<=0&&df>-30)fire(d+q.id+'e','⌛ ถึงเวลาภารกิจแล้ว',q.title)});
S.notes.forEach(n=>{if(n.rem&&!n.arch){const t=new Date(n.rem).getTime();if(Date.now()>=t&&Date.now()-t<36e5)fire(d+'n'+n.id,'📝 เตือนความจำ',n.t||n.b.slice(0,40))}});
const rem=questsOn(d).filter(q=>!done(q,d)).length;if(S.notif.sum&&n>=tm(S.notif.sum)&&rem>0)fire(d+'sum','📋 ภารกิจวันนี้','ยังเหลืออีก '+rem+' ภารกิจ');if(ch)save()}
setInterval(tick,20000);

const NCAT=['สิ่งที่ต้องจำ','งานที่ต้องทำ','ไอเดีย','การเรียน','งานและโปรเจกต์','ข้อมูลส่วนตัว','เป้าหมาย','อื่น ๆ'];

const nDt=r=>new Date(r).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const nHtml=n=>`<div class="card" onclick="noteEdit('${n.id}')"><div class="row sp"><b>${n.pin?'📌 ':''}${n.fav?'⭐ ':''}${esc(n.t||'(ไม่มีหัวข้อ)')}</b><span class="tag" style="background:#8882">${esc(n.cat)}</span></div>${n.b?`<small>${esc(n.b.slice(0,90))}</small>`:''}<div>${(n.tags||[]).map(x=>`<span class="tag" style="background:#8882;color:var(--prog)">#${esc(x)}</span>`).join('')}${n.rem?`<span class="tag" style="background:#8882">⏰ ${nDt(n.rem)}</span>`:''}</div></div>`;
function nList(){const q=NQ.toLowerCase(),l=S.notes.filter(n=>!!n.arch==NA&&(!NC||n.cat==NC)&&(!q||(n.t+' '+n.b+' '+(n.tags||[]).join(' ')).toLowerCase().includes(q))).sort((a,b)=>(!!b.pin-!!a.pin)||(NSORT=='c'?b.c-a.c:b.u-a.u));

function vNotes(){return `<h2>โน้ตและสิ่งที่ต้องจำ</h2><input placeholder="🔍 ค้นหาโน้ต" value="${esc(NQ)}" oninput="NQ=this.value;$('#nl').innerHTML=nList()"><div class="seg"><span class="${NA?'':'on'}" onclick="NA=false;render()">ใช้งาน</span><span class="${NA?'on':''}" onclick="NA=true;render()">เก็บถาวร</span><span class="${NSORT=='u'?'on':''}" onclick="NSORT='u';render()">แก้ไขล่าสุด</span><span class="${NSORT=='c'?'on':''}" onclick="NSORT='c';render()">สร้างล่าสุด</span></div><select onchange="NC=this.value;render()"><option value="">ทุกหมวดหมู่</option>${NCAT.map(c=>`<option ${NC==c?'selected':''}>${c}</option>`).join('')}</select><div id="nl">${nList()}</div><button class="fab" onclick="noteEdit()">+</button>`}
function noteEdit(id){const n=S.notes.find(x=>x.id==id)||{t:'',b:'',cat:NCAT[0],tags:[],rem:'',pin:false,fav:false};E={nid:id};
modal(`<h3>${id?'แก้ไขโน้ต':'โน้ตใหม่'}</h3><input id="n_t" placeholder="หัวข้อ" value="${esc(n.t)}"><textarea id="n_b" rows="5" placeholder="เนื้อหา">${esc(n.b)}</textarea><label>หมวดหมู่</label><select id="n_c">${NCAT.map(c=>`<option ${n.cat==c?'selected':''}>${c}</option>`).join('')}</select><label>แท็ก (คั่นด้วยจุลภาค)</label><input id="n_g" value="${esc((n.tags||[]).join(', '))}"><label>เตือนความจำ (ไม่บังคับ)</label><input id="n_r" type="datetime-local" value="${n.rem||''}"><div class="tgl"><span>📌 ปักหมุด</span><input id="n_p" type="checkbox" ${n.pin?'checked':''}></div><div class="tgl"><span>⭐ รายการโปรด</span><input id="n_f" type="checkbox" ${n.fav?'checked':''}></div><div class="row" style="flex-wrap:wrap"><button class="sec g" onclick="closeModal()">ยกเลิก</button><button class="g" onclick="noteSave()">บันทึก</button>${id?`<button class="sec g" onclick="noteArch('${id}')">${n.arch?'📤 คืนค่า':'📦 เก็บถาวร'}</button><button class="dng g" onclick="noteDel('${id}')">🗑 ลบ</button>`:''}</div>`)}
function noteSave(){const t=$('#n_t').value.trim(),b=$('#n_b').value.trim();if(!t&&!b){toast('ใส่หัวข้อหรือเนื้อหาก่อน');return}
const o={t,b,cat:$('#n_c').value,tags:$('#n_g').value.split(',').map(x=>x.trim()).filter(Boolean),rem:$('#n_r').value,pin:$('#n_p').checked,fav:$('#n_f').checked,u:Date.now()},n=S.notes.find(x=>x.id==E.nid);
if(n)Object.assign(n,o);else S.notes.push({id:uid(),c:Date.now(),arch:false,...o});save();closeModal();render();toast('บันทึกโน้ตแล้ว')}
function noteArch(id){const n=S.notes.find(x=>x.id==id);n.arch=!n.arch;n.u=Date.now();save();closeModal();render()}
function noteDel(id){ask('ลบโน้ตนี้? กู้คืนไม่ได้',()=>{S.notes=S.notes.filter(x=>x.id!=id);save();render()})}
function NH(){const l=S.notes.filter(n=>!n.arch&&(n.pin||(n.rem&&new Date(n.rem)>Date.now()-36e5))).sort((a,b)=>(a.rem?new Date(a.rem):1e15)-(b.rem?new Date(b.rem):1e15)).slice(0,3);
return l.length?`<div class="card"><div class="row sp"><h3>📝 โน้ตสำคัญ</h3><small onclick="go('notes')" style="cursor:pointer">ดูทั้งหมด ›</small></div>${l.map(n=>`<div class="ir" onclick="noteEdit('${n.id}')"><span>${n.pin?'📌 ':''}${esc(n.t||n.b.slice(0,30))}</span><small>${n.rem?nDt(n.rem):''}</small></div>`).join('')}</div>`:''}
const QA=()=>`<div class="row" style="flex-wrap:wrap"><button class="g" onclick="tplPick()">＋ เพิ่มภารกิจ</button><button class="sec g" onclick="go('focus')">⏱ จับเวลา</button><button class="sec g" onclick="noteEdit()">📝 โน้ต</button></div>`;
let F=null,FI=null,FS={q:'',m:25,k:'f'};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fLeft=()=>F.p?F.left:Math.max(0,Math.round((F.end-Date.now())/1000));
function vFocus(){const d=today(),fl=S.focus.filter(x=>x.d==d),fm=fl.filter(x=>x.k=='f').reduce((a,x)=>a+x.m,0),bm=fl.filter(x=>x.k=='b').reduce((a,x)=>a+x.m,0);
const sum=`<div class="card"><h3>วันนี้</h3><div class="ir"><span>เวลาโฟกัส</span><b>${fm} นาที</b></div><div class="ir" style="border:0"><span>เวลาพัก</span><b>${bm} นาที</b></div></div>`;
if(F)return `<h2>โฟกัส</h2><div class="card" style="text-align:center"><small>${F.k=='f'?'🎯 กำลังโฟกัส':'☕ เวลาพัก'}${F.t?' · '+esc(F.t):''}</small><div class="ring" id="fr" style="margin:14px auto;width:210px;height:210px"><div style="width:168px;height:168px"><b id="ft" style="font-size:40px">${mmss(fLeft())}</b></div></div><div class="row"><button class="sec g" onclick="fPause()">${F.p?'▶ ทำต่อ':'⏸ พัก'}</button><button class="g" onclick="fEnd(1)">✓ จบ</button><button class="dng g" onclick="fEnd(0)">ยกเลิก</button></div></div>`+sum;
const ls=questsOn(d).filter(q=>!done(q,d));
return `<h2>โฟกัส</h2><div class="card"><label>ภารกิจที่จะทำ</label><select onchange="FS.q=this.value"><option value="">ไม่ระบุ</option>${ls.map(q=>`<option value="${q.id}" ${FS.q==q.id?'selected':''}>${esc(q.title)}</option>`).join('')}</select><label>ระยะเวลา (นาที)</label><div class="seg">${[5,15,25,45,60,90].map(m=>`<span class="${FS.m==m?'on':''}" onclick="FS.m=${m};render()">${m}</span>`).join('')}</div><div class="seg"><span class="${FS.k=='f'?'on':''}" onclick="FS.k='f';render()">🎯 โฟกัส</span><span class="${FS.k=='p'?'on':''}" onclick="FS.k='p';FS.m=25;render()">🍅 Pomodoro 25/5</span><span class="${FS.k=='b'?'on':''}" onclick="FS.k='b';FS.m=5;render()">☕ พัก</span></div><button style="width:100%;margin-top:8px" onclick="fStart()">▶ เริ่ม</button></div>`+sum}
function fRun(k,mins,t,qid,pom){F={k,t,qid,pom,total:mins*60,end:Date.now()+mins*60000,p:false};clearInterval(FI);FI=setInterval(fUi,500);render()}
function fStart(){const q=S.quests.find(x=>x.id==FS.q);fRun(FS.k=='b'?'b':'f',FS.m,q?q.title:'',FS.q,FS.k=='p')}
function fUi(){if(!F)return;const l=fLeft(),e=$('#ft');if(e){e.textContent=mmss(l);$('#fr').style.background=`conic-gradient(var(--prog) ${(1-l/F.total)*360}deg,#8883 0)`}if(l<=0&&!F.p&&!F.fin){F.fin=1;fDone()}}
function fPause(){if(F.p){F.end=Date.now()+F.left*1000;F.p=false}else{F.left=fLeft();F.p=true}render()}
function fLog(){const m=Math.max(1,Math.round((F.total-fLeft())/60));S.focus.push({d:today(),k:F.k,q:F.qid,t:F.t,m});return m}
function fEnd(ok){if(ok)fLog();clearInterval(FI);F=null;save();render()}
function fDone(){notify('⏱ หมดเวลา!',F.t||'');modal(`<h3>🎉 หมดเวลาแล้ว</h3><p>${esc(F.t)}</p><div class="row" style="flex-wrap:wrap"><button class="g" onclick="fFin()">✅ สำเร็จ</button><button class="sec g" onclick="fMore()">+5 นาที</button><button class="dng g" onclick="closeModal();fEnd(1)">หยุด</button></div>`)}
function fMore(){closeModal();F.total+=300;F.end=Date.now()+300000;F.fin=0;render()}
function fFin(){closeModal();const{k,qid,pom}=F,q=S.quests.find(x=>x.id==qid);fLog();clearInterval(FI);F=null;if(k=='f'&&q&&!done(q,today())&&appears(q,today()))complete(qid,today());save();if(pom)fRun(k=='f'?'b':'f',k=='f'?5:25,k=='f'?'':(q?q.title:''),qid,true);else render()}
const SB_URL='https://fgmdmklwcwtkiyrwvusy.supabase.co',SB_KEY='sb_publishable_RyU5wwcBta4KgU5nyAiTFw_n3PStrtC';
let sb=null,USER=null,booting=true,syncing=false,syncT=null,synced=new Set(),AM={mode:'in',err:'',busy:false,e:''};
try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function vAuth(){const up=AM.mode=='up';return '<div style="text-align:center;padding-top:30px"><div style="font-size:70px">⚔️</div><h1 style="font-size:34px;letter-spacing:2px">LIFE QUEST</h1><p style="color:var(--mut)">เข้าสู่ระบบเพื่อซิงก์ภารกิจข้ามอุปกรณ์</p></div><div class="card"><div class="seg"><span class="'+(up?'':'on')+'" onclick="AM.mode=\'in\';AM.err=\'\';render()">เข้าสู่ระบบ</span><span class="'+(up?'on':'')+'" onclick="AM.mode=\'up\';AM.err=\'\';render()">สมัครสมาชิก</span></div><label>อีเมล</label><input id="a_e" type="email" autocomplete="email" value="'+esc(AM.e)+'"><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="a_p" type="password" autocomplete="'+(up?'new-password':'current-password')+'">'+(AM.err?'<p style="color:#f87171">'+esc(AM.err)+'</p>':'')+(sb?'':'<p style="color:#f87171">โหลดบริการล็อกอินไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช</p>')+'<button style="width:100%" '+(AM.busy||!sb?'disabled':'')+' onclick="doAuth()">'+(AM.busy?'กำลังดำเนินการ…':up?'สมัครสมาชิก':'เข้าสู่ระบบ')+'</button></div>'}
async function doAuth(){const e=$('#a_e').value.trim(),p=$('#a_p').value;AM.e=e;AM.err='';if(!e||p.length<6){AM.err='กรอกอีเมลและรหัสผ่านอย่างน้อย 6 ตัว';render();return}
AM.busy=true;render();
try{const r=AM.mode=='up'?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;
if(!r.data.session){AM.err='สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ';AM.mode='in'}}
catch(x){AM.err=/invalid login/i.test(x.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':/already/i.test(x.message)?'อีเมลนี้สมัครแล้ว ลองเข้าสู่ระบบ':x.message}
AM.busy=false;render()}
function initAuth(){setTimeout(()=>{if(booting&&!USER){booting=false;render()}},5000);if(!sb){booting=false;render();return}
sb.auth.onAuthStateChange((ev,s)=>{if(s&&s.user){if(!USER||USER.id!=s.user.id){USER=s.user;setTimeout(onLogin,0)}}else if(ev=='SIGNED_OUT'||ev=='INITIAL_SESSION'){USER=null;booting=false;render()}})}
async function onLogin(){booting=true;render();try{await pull()}catch(e){console.warn(e);toast('โหลดข้อมูลจากคลาวด์ไม่สำเร็จ ใช้ข้อมูลในเครื่องแทน')}booting=false;render();tick()}
function fixIds(){const m={};S.quests.forEach(q=>{if(!UUID.test(q.id)){m[q.id]=crypto.randomUUID();q.id=m[q.id]}});
for(const d in S.log){const L=S.log[d];for(const k of Object.keys(L)){if(m[k]){L[m[k]]=L[k];delete L[k]}else if(!UUID.test(k)){L[crypto.randomUUID()]=L[k];delete L[k]}}}}
async function pull(){const u=USER.id;if(S.uid==u&&S.dirty)await push();
const[p,q,c]=await Promise.all([sb.from('profiles').select('*').eq('id',u).maybeSingle(),sb.from('quests').select('*').eq('user_id',u),sb.from('completions').select('*').eq('user_id',u)]);
const er=p.error||q.error||c.error;if(er)throw er;
if(!p.data){S.uid=u;await push();return}
const pr=p.data,n=pr.notif||{},t=pr.theme||{},log={};
c.data.forEach(r=>{(log[r.day]=log[r.day]||{})[r.quest_id]={t:r.title,c:r.cat,x:r.exp,m:r.mins||0}});
S=Object.assign(DEF(),{uid:u,name:pr.name||'',avatar:pr.avatar||'🧙',onboarded:!!pr.name,exp:pr.exp||0,quests:q.data.map(r=>Object.assign(r.data,{id:r.id})),log,bonus:n.bonus||{},ach:n.ach||{},notes:n.notes||[],fav:n.fav||[],focus:n.focus||[],use:n.use||{},theme:t.theme||DEF().theme,saved:t.saved||[],notif:n.notif||DEF().notif});
synced=new Set(c.data.map(r=>r.day+r.quest_id));saveLocal()}
async function push(){if(!sb||!USER)return;const u=USER.id;fixIds();
let r=await sb.from('profiles').upsert({id:u,name:S.name,avatar:S.avatar,exp:S.exp,theme:{theme:S.theme,saved:S.saved},notif:{notif:S.notif,ach:S.ach,bonus:S.bonus,notes:S.notes,fav:S.fav,focus:S.focus,use:S.use}});if(r.error)throw r.error;
if(S.quests.length){r=await sb.from('quests').upsert(S.quests.map(q=>({id:q.id,user_id:u,data:q})));if(r.error)throw r.error}
if(S.del.length){r=await sb.from('quests').delete().in('id',S.del).eq('user_id',u);if(r.error)throw r.error;S.del=[]}
const rows=[];for(const d in S.log)for(const k in S.log[d]){if(synced.has(d+k))continue;const e=S.log[d][k];rows.push({user_id:u,quest_id:k,day:d,title:e.t,cat:e.c,exp:e.x,mins:e.m||0})}
if(rows.length){r=await sb.from('completions').upsert(rows,{onConflict:'user_id,quest_id,day'});if(r.error)throw r.error;rows.forEach(w=>synced.add(w.day+w.quest_id))}
S.dirty=false;S.uid=u;saveLocal()}
function queueSync(){if(!USER)return;clearTimeout(syncT);syncT=setTimeout(doSync,1200)}
async function doSync(){if(syncing){syncT=setTimeout(doSync,1500);return}syncing=true;try{await push()}catch(e){console.warn(e)}syncing=false}
addEventListener('online',()=>{if(USER&&S.dirty)doSync()});
async function logout(){if(S.dirty){try{await push()}catch(e){}}try{await sb.auth.signOut()}catch(e){}S=DEF();synced=new Set();saveLocal();USER=null;R='home';render()}
async function resetAll(){try{const u=USER.id;for(const [t,c] of [['completions','user_id'],['quests','user_id'],['profiles','id']]){const r=await sb.from(t).delete().eq(c,u);if(r.error)throw r.error}}catch(e){toast('ลบข้อมูลบนคลาวด์ไม่สำเร็จ');return}S=DEF();synced=new Set();saveLocal();R='home';render()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
render();tick();initAuth();
