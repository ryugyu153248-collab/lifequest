<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE QUEST</title>
<meta name="theme-color" content="#0B1230"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LIFE QUEST">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--pri:#7857FF;--btn:#7857FF;--prog:#4DA3FF;--bg:#0B1230;--card:#1A1F4A;--txt:#F8FAFC;--ctxt:#F8FAFC;--onbtn:#fff;--mut:#9aa3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;font-size:1rem}
#app{max-width:480px;margin:0 auto;padding:14px 14px 100px;min-height:100vh}
h1,h2,h3{margin:0}h2{font-size:20px}h3{font-size:16px}small{color:var(--mut)}
.card{background:var(--card);color:var(--ctxt);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 14px #0003}
.card small{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{flex:1}
.bar{height:12px;border-radius:9px;background:#8883;overflow:hidden}.bar i{display:block;height:100%;background:var(--prog);border-radius:9px;transition:width .5s;box-shadow:0 0 10px var(--prog)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--btn);color:var(--onbtn);font-weight:600;cursor:pointer}
button.sec{background:#8883;color:var(--ctxt)}button.dng{background:#dc2626;color:#fff}button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:12px;border:1px solid #8885;background:#0000001a;color:inherit;margin:4px 0 8px}
input[type=color]{padding:2px;height:42px;width:56px}input[type=checkbox]{width:auto}
label{font-size:13px;color:var(--mut)}
.q{display:flex;gap:12px;align-items:center}.q.dn{opacity:.6}.q.dn b{text-decoration:line-through}
.ic{font-size:26px;width:46px;height:46px;border-radius:14px;background:#8882;display:grid;place-items:center;flex:none}
.qb{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.qb b{overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;color:var(--prog);font-weight:600}
.ck{padding:8px 12px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);color:var(--ctxt);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #8883;z-index:5}
nav div{display:flex;width:100%;max-width:480px}
nav a{flex:1;text-align:center;font-size:12px;color:var(--mut);cursor:pointer;padding:4px}nav a b{display:block;font-size:20px}nav a.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:6;box-shadow:0 0 18px var(--pri)}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);color:var(--ctxt);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#ts div{background:var(--pri);color:#fff;padding:9px 16px;border-radius:14px;font-weight:600;box-shadow:0 4px 16px #0006;animation:in .3s;max-width:90%}
@keyframes in{from{transform:translateY(-20px);opacity:0}}
.lv{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;text-align:center;color:#fff;animation:in .4s}
.lv .n{font-size:90px;animation:pop .8s infinite alternate;text-shadow:0 0 30px var(--pri)}@keyframes pop{to{transform:scale(1.15)}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.seg>*{padding:8px 12px;border-radius:12px;background:#8883;cursor:pointer;font-size:13px;border:2px solid transparent}.seg .on{border-color:var(--pri);background:#8885}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--txt)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cal div{padding:6px 0;border-radius:8px;cursor:pointer}.cal .h{color:var(--mut);cursor:default}
.chart{display:flex;gap:8px;align-items:flex-end;height:110px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.chart i{display:block;background:var(--prog);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:3px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ach div{text-align:center;padding:10px 4px;border-radius:14px;background:#8882;font-size:12px}.ach .lk{opacity:.35;filter:grayscale(1)}.ach b{font-size:28px;display:block}
.av{font-size:64px;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:#8882;border:3px solid var(--pri);box-shadow:0 0 20px var(--pri);margin:0 auto}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.lnk{display:flex;justify-content:space-between;padding:14px 4px;cursor:pointer;border-bottom:1px solid #8882}
.emp{text-align:center;padding:30px 10px;color:var(--mut)}

body{background:radial-gradient(700px 420px at 50% -80px,color-mix(in srgb,var(--pri) 38%,transparent),transparent) fixed,var(--bg)}
.card{border:1px solid color-mix(in srgb,var(--pri) 30%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card))}
button,.btn{background:linear-gradient(90deg,var(--btn),color-mix(in srgb,var(--btn) 55%,var(--prog)));box-shadow:0 0 16px color-mix(in srgb,var(--btn) 45%,transparent)}
button.sec,button.dng{box-shadow:none}button.sec{background:#8883}button.dng{background:#dc2626}
nav{border-radius:22px 22px 0 0;border:1px solid color-mix(in srgb,var(--pri) 30%,transparent);border-bottom:0}nav a.on b{filter:drop-shadow(0 0 6px var(--pri))}
.sw{width:100%!important;height:64px;border-radius:16px!important}
.hd{display:flex;align-items:center;gap:12px}.av2{font-size:30px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#8883;border:2px solid var(--pri);box-shadow:0 0 14px var(--pri);flex:none}
.dots{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}.dots i{width:22px;height:22px;border-radius:50%;border:2px solid #8886;display:grid;place-items:center;font-size:12px;font-style:normal;color:#fff}.dots i.f{background:#22c55e;border-color:#22c55e;box-shadow:0 0 8px #22c55e}
.rc{width:34px;height:34px;border-radius:50%;border:2px solid #8887;display:grid;place-items:center;flex:none;padding:0;background:none!important;box-shadow:none!important;color:#fff}.rc.f{background:#22c55e!important;border-color:#22c55e}
.q.dn{background:linear-gradient(160deg,#16a34a44,var(--card));border-color:#22c55e88;opacity:1}.q.dn b{text-decoration:none}.q.ps{opacity:.5}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;display:inline-block;margin:2px 4px 0 0}
.hero{height:300px;border-radius:26px;margin:6px 0 14px;background:radial-gradient(circle at 50% 30%,#ffe8a366,transparent 40%),linear-gradient(180deg,#1b1b5e,#4b2a8a 60%,#d9779f);display:grid;place-items:center;font-size:96px;position:relative;overflow:hidden;box-shadow:0 0 30px var(--pri)}
.hero:after{content:'';position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--bg))}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.ir{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #8882}
</style></head><body>
<div id="app"></div><div id="md" onclick="if(event.target==this)closeModal()"></div><div id="ts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const K='lifequest_v1';
const PRE={fantasy:{n:'Fantasy Purple',pri:'#7857FF',btn:'#7857FF',prog:'#4DA3FF',bg:'#0B1230',card:'#1A1F4A'},space:{n:'Space Blue',pri:'#3B82F6',btn:'#2563EB',prog:'#38BDF8',bg:'#060E24',card:'#0F1D45'},nature:{n:'Nature Green',pri:'#22C55E',btn:'#16A34A',prog:'#86EFAC',bg:'#0A1F14',card:'#12301F'},sakura:{n:'Sakura Pink',pri:'#F472B6',btn:'#EC4899',prog:'#F9A8D4',bg:'#2A1220',card:'#3B1A2E'},sunset:{n:'Sunset Orange',pri:'#FB923C',btn:'#F97316',prog:'#FDBA74',bg:'#241209',card:'#3A1F10'},mono:{n:'Minimal Monochrome',pri:'#E5E5E5',btn:'#A3A3A3',prog:'#D4D4D4',bg:'#0A0A0A',card:'#1C1C1C'}};
const DIFF={easy:{n:'ง่าย',x:10},mid:{n:'ปานกลาง',x:25},hard:{n:'ยาก',x:50}};
const CATS=['อ่านหนังสือ','สุขภาพ','การเรียนรู้','งาน','ไลฟ์สไตล์','บ้าน'];
const ICONS=['📚','🏃','💧','🧹','☕','🌅','💼','🎯','🇬🇧','🧘','🍎','🎨'];
const AVS=['🧙','🦸','🧝','🥷','🐉','🦊','🤖','👑'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DEF=()=>({name:'',avatar:'🧙',onboarded:false,exp:0,quests:[],log:{},bonus:{},ach:{},del:[],uid:null,dirty:false,fs:15,theme:{preset:'fantasy',mode:'dark',ov:{}},saved:[],notif:{on:true,leads:[10],end:true,sum:'18:00',quiet:{on:false,from:'22:00',to:'07:00'}},fired:{}});
let S=DEF(),R='home',D=null,cm=new Date(),selDay=null,E={};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){}
const saveLocal=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{S.dirty=true;saveLocal();queueSync()};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>key(new Date());
const pd=k=>new Date(k+'T00:00:00');
const thDate=(k,o)=>pd(k).toLocaleDateString('th-TH',o||{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const uid=()=>crypto.randomUUID();
/* ---------- colour / theme tokens ---------- */
const rgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const hex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return hex(x.map((v,i)=>v*(1-t)+y[i]*t))};
const lum=h=>{const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const ink=h=>lum(h)>.45?'#111827':'#F8FAFC';
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const okHex=v=>/^#[0-9a-fA-F]{6}$/.test(v);
function resolve(t){const p=PRE[t.preset]||PRE.fantasy,o=t.ov||{};const m=t.mode=='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t.mode,L=m=='light';
const fx=c=>L&&lum(c)>.6?mix(c,'#000000',.65):c;
const bg=o.bg||(L?mix(p.pri,'#ffffff',.93):p.bg),card=o.card||(L?'#ffffff':p.card),btn=o.btn||fx(p.btn),pri=o.pri||fx(p.pri),prog=o.prog||fx(p.prog);
const txt=o.txt||ink(bg),ctxt=o.txt||ink(card);
return{'--pri':pri,'--btn':btn,'--prog':prog,'--bg':bg,'--card':card,'--txt':txt,'--ctxt':ctxt,'--onbtn':ink(btn),'--mut':mix(ctxt,card,.4)}}
function paint(el,t){const v=resolve(t);for(const k in v)el.style.setProperty(k,v[k])}
/* ---------- game logic ---------- */
function lvlOf(x){let l=1,need=100;while(x>=need){x-=need;l++;need=100+(l-1)*50}return{l,cur:x,need}}
const dow=k=>pd(k).getDay();
const appears=(q,d)=>!q.paused&&(q.rep=='once'?q.date==d:d>=q.start&&(q.rep=='daily'||(q.days||[]).includes(dow(d))));
const questsOn=d=>S.quests.filter(q=>appears(q,d)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const done=(q,d)=>!!(S.log[d]&&S.log[d][q.id]);
const dayCount=d=>Object.keys(S.log[d]||{}).length;
function streaks(){const ks=Object.keys(S.log).filter(k=>dayCount(k)>0).sort();const has=new Set(ks);let d=new Date();if(!has.has(key(d)))d.setDate(d.getDate()-1);let cur=0;while(has.has(key(d))){cur++;d.setDate(d.getDate()-1)}
let best=0,run=0,prev=null;ks.forEach(k=>{run=prev&&Math.round((pd(k)-pd(prev))/864e5)==1?run+1:1;best=Math.max(best,run);prev=k});return{cur,best}}
function totals(){let n=0,read=0;for(const d in S.log)for(const i in S.log[d]){n++;if(S.log[d][i].c=='อ่านหนังสือ')read+=S.log[d][i].m||0}return{n,read,bon:Object.keys(S.bonus).length,lv:lvlOf(S.exp).l,...streaks()}}
const ACH=[['first','🌟','ก้าวแรก','ทำภารกิจแรกสำเร็จ',s=>s.n>=1],['st7','🔥','ไฟลุกโชน','ทำภารกิจต่อเนื่อง 7 วัน',s=>s.best>=7],['n50','🏆','นักสู้ตัวจริง','ทำภารกิจสำเร็จ 50 ครั้ง',s=>s.n>=50],['rd','📚','หนอนหนังสือ','อ่านหนังสือครบ 10 ชั่วโมง',s=>s.read>=600],['lv5','⚔️','นักผจญภัย','ถึงเลเวล 5',s=>s.lv>=5],['all','🎯','ครบทั้งวัน','ทำภารกิจครบทั้งวัน',s=>s.bon>=1]];
function checkAch(){const t=totals();ACH.forEach(a=>{if(!S.ach[a[0]]&&a[4](t)){S.ach[a[0]]=today();setTimeout(()=>notify('🏅 ปลดล็อก Achievement',a[2]+' — '+a[3]),700)}})}
function complete(id,d){const q=S.quests.find(x=>x.id==id);if(!q||done(q,d)||d!=today())return;const L=lvlOf(S.exp).l,x=DIFF[q.diff].x;
(S.log[d]=S.log[d]||{})[id]={t:q.title,c:q.cat,x,m:q.mins||0};S.exp+=x;let m='+'+x+' EXP';
const ls=questsOn(d);if(ls.length&&ls.every(a=>done(a,d))&&!S.bonus[d]){S.bonus[d]=1;S.exp+=30;m+=' · โบนัสครบวัน +30'}
notify('✅ '+q.title,m);checkAch();save();closeModal();render();if(lvlOf(S.exp).l>L)levelUp()}
function levelUp(){const l=lvlOf(S.exp).l;const o=document.createElement('div');o.className='lv';o.onclick=()=>o.remove();o.innerHTML='<div><div style="font-size:40px">🎉✨🎊</div><div class="n">LV '+l+'</div><h2>ยินดีด้วย! เลเวลอัปแล้ว</h2><p>แตะเพื่อไปต่อ</p></div>';document.body.appendChild(o);notify('⬆️ เลเวลอัป!','คุณเลเวล '+l+' แล้ว')}
/* ---------- notifications (works while app is open) ---------- */
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tm=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const quiet=()=>{const q=S.notif.quiet;if(!q.on)return false;const n=nowM(),a=tm(q.from),b=tm(q.to);return a<=b?n>=a&&n<b:n>=a||n<b};
function toast(m){const e=document.createElement('div');e.textContent=m;$('#ts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function notify(t,b){toast(t+(b?' '+b:''));if(!S.notif.on||quiet())return;try{if('Notification' in window&&Notification.permission=='granted')new Notification(t,{body:b})}catch(e){}}
function tick(){if(!S.onboarded||!S.notif.on)return;const d=today(),n=nowM();let ch=false;
const fire=(k,t,b)=>{if(S.fired[k])return;S.fired[k]=1;ch=true;notify(t,b)};
for(const k in S.fired)if(!k.startsWith(d))delete S.fired[k];
questsOn(d).forEach(q=>{if(!q.time||done(q,d))return;const df=tm(q.time)-n;
S.notif.leads.forEach(l=>{if(df>0&&df<=l)fire(d+q.id+l,'⏰ อีก '+df+' นาที',q.title)});
if(S.notif.end&&df<=0&&df>-30)fire(d+q.id+'e','⌛ ถึงเวลาภารกิจแล้ว',q.title)});
const rem=questsOn(d).filter(q=>!done(q,d)).length;if(S.notif.sum&&n>=tm(S.notif.sum)&&rem>0)fire(d+'sum','📋 ภารกิจวันนี้','ยังเหลืออีก '+rem+' ภารกิจ');if(ch)save()}
setInterval(tick,20000);
/* ---------- modal helpers ---------- */
function modal(h){const m=$('#md');m.innerHTML='<div class="sheet">'+h+'</div>';m.style.display='flex'}
function closeModal(){$('#md').style.display='none';$('#md').innerHTML=''}
function ask(msg,fn){window._ask=fn;modal('<h3>'+msg+'</h3><div class="row" style="margin-top:14px"><button class="sec g" onclick="closeModal()">ยกเลิก</button><button class="dng g" onclick="closeModal();_ask()">ยืนยัน</button></div>')}
/* ---------- views ---------- */
const nav=()=>{const t=['home','quests','stats','profile'],ic=['🏠','📜','📊','🧙'],nm=['หน้าหลัก','ภารกิจ','สถิติ','โปรไฟล์'];const cur=['settings','notif','theme','general'].includes(R)?'profile':R;
return '<nav><div>'+t.map((k,i)=>'<a class="'+(cur==k?'on':'')+'" onclick="go(\''+k+'\')"><b>'+ic[i]+'</b>'+nm[i]+'</a>').join('')+'</div></nav>'};
const back=(t,to)=>'<div class="row" style="margin-bottom:6px"><button class="sec" onclick="go(\''+(to||'settings')+'\')">‹</button><h2>'+t+'</h2></div>';
function go(r){R=r;if(r=='theme')D=JSON.parse(JSON.stringify(S.theme));window.scrollTo(0,0);render()}
const CC={'อ่านหนังสือ':'#22c55e','สุขภาพ':'#3b82f6','การเรียนรู้':'#a78bfa','งาน':'#f59e0b','ไลฟ์สไตล์':'#f97316','บ้าน':'#14b8a6'};
const cc=c=>CC[c]||'#7857ff';
const titleOf=l=>l<3?'Novice':l<5?'Apprentice':l<8?'Adventurer':l<12?'Hero':'Legend';
const NS='<div class="card"><h3>ตัวอย่างข้อความแจ้งเตือน</h3>'+[['📚','ภารกิจอ่านหนังสือของคุณยังรออยู่','20:00'],['⭐','วันนี้เหลืออีก 2 ภารกิจ อย่าลืมรับ EXP','18:00'],['⌛','เหลือเวลาอีก 1 ชั่วโมงก่อนหมดเวลาภารกิจ','']].map(a=>'<div class="ir"><span>'+a[0]+' '+a[1]+'</span><small>'+a[2]+'</small></div>').join('')+'</div>';
function qs(k){$('#f_t').value=k;suggest()}
function qCard(q,d){const dn=done(q,d),f=DIFF[q.diff],c=cc(q.cat);
return '<div class="card q '+(dn?'dn':'')+'" onclick="detail(\''+q.id+'\',\''+d+'\')"><div class="ic" style="background:'+c+'33">'+q.icon+'</div><div class="qb"><b>'+esc(q.title)+'</b><span><span class="tag" style="background:'+c+'33;color:'+c+'">'+esc(q.cat)+'</span><span class="tag" style="background:#8882;color:var(--prog)">+'+f.x+' EXP</span></span></div><small style="text-align:right">'+(d==today()?'วันนี้ ':'')+(q.time||'ทั้งวัน')+'</small>'+(d==today()?'<button class="rc '+(dn?'f':'')+'" '+(dn?'disabled':'')+' onclick="event.stopPropagation();complete(\''+q.id+'\',\''+d+'\')">'+(dn?'✓':'')+'</button>':'')+'</div>'}
function vHome(){const d=today(),ls=questsOn(d),dn=ls.filter(q=>done(q,d)).length,L=lvlOf(S.exp);

async function pull(){const u=USER.id;if(S.uid==u&&S.dirty)await push();

const er=p.error||q.error||c.error;if(er)throw er;

const pr=p.data,n=pr.notif||{},t=pr.theme||{},log={};
c.data.forEach(r=>{(log[r.day]=log[r.day]||{})[r.quest_id]={t:r.title,c:r.cat,x:r.exp,m:r.mins||0}});

async function push(){if(!sb||!USER)return;const u=USER.id;fixIds();
